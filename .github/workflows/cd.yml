name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: Deploy frontend to Vercel
        type: boolean
        default: true
      deploy_docker:
        description: Push Docker images to GHCR
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  AUTH_IMAGE: ghcr.io/${{ github.repository }}/auth

jobs:
  publish-docker:
    name: Publish Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy_docker != false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Auth)
        id: meta-auth
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AUTH_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build & push Auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || inputs.deploy_frontend != false) && vars.ENABLE_VERCEL_DEPLOY == 'true'
    environment: production
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_AUTH_URL: ${{ secrets.VITE_AUTH_URL }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [publish-docker, deploy-frontend]
    if: always() && !cancelled()
    env:
      API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - name: Smoke test deployed services
        run: |
          set -e
          checked=0

          if [ -n "$API_HEALTH_URL" ]; then
            checked=1
            echo "Checking API: $API_HEALTH_URL"
            for i in 1 2 3 4 5; do
              if curl -fsS "$API_HEALTH_URL"; then
                echo "API health check passed"
                break
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
              if [ "$i" -eq 5 ]; then
                echo "API health check failed"
                exit 1
              fi
            done
          fi

          if [ -n "$FRONTEND_URL" ]; then
            checked=1
            echo "Checking frontend: $FRONTEND_URL"
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
            if echo "$code" | grep -qE '200|301|302'; then
              echo "Frontend check passed (HTTP $code)"
            else
              echo "Frontend check failed (HTTP $code)"
              exit 1
            fi
          fi

          if [ "$checked" -eq 0 ]; then
            echo "No smoke test URLs configured. Set API_HEALTH_URL and/or FRONTEND_URL secrets."
          fi
