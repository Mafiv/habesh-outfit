services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/stylish
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min-32-chars!!
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:5173
      PORT: "3001"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/stylish
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min-32-chars!!
      BETTER_AUTH_URL: http://auth:3001
      FRONTEND_URL: http://localhost:5173
      DJANGO_SECRET_KEY: django-dev-secret-change-me
      DEBUG: "True"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    depends_on:
      mongodb:
        condition: service_healthy
      auth:
        condition: service_started

volumes:
  mongo_data:
